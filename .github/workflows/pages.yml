name: Publish VELORA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: velora-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the media verification tools
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Restore licensed 4K media
        run: python3 scripts/restore-media.py
      - name: Retain the complete media in the source repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/media/velora
          if ! git diff --cached --quiet; then
            git commit -m 'Add licensed 4K photos, films and mobile variants'
            git push origin HEAD:main
          fi
      - name: Build and verify all pages
        run: npm run build && npm run check
      - name: Publish the static files to gh-pages
        env:
          GIT_INDEX_FILE: ${{ runner.temp }}/velora-pages-index
        run: |
          git read-tree --empty
          git --work-tree="$PWD/dist" add --all --force
          pages_tree=$(git write-tree)
          previous=$(git ls-remote --heads origin refs/heads/gh-pages | cut -f1)
          if [ -n "$previous" ]; then
            git fetch origin gh-pages --depth=1
            pages_commit=$(printf 'Publish VELORA from %s\n' "$GITHUB_SHA" | git commit-tree "$pages_tree" -p "$previous")
          else
            pages_commit=$(printf 'Publish VELORA from %s\n' "$GITHUB_SHA" | git commit-tree "$pages_tree")
          fi
          git push origin "$pages_commit:refs/heads/gh-pages"
      - name: Request the GitHub Pages build
        env:
          GH_PUBLISH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.error, urllib.request
          url='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/pages/builds'
          request=urllib.request.Request(url,method='POST',headers={'Authorization':'Bearer '+os.environ['GH_PUBLISH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
          try:
              with urllib.request.urlopen(request) as response: print('GitHub Pages build requested:',response.status)
          except urllib.error.HTTPError as error:
              if error.code not in [403,404,409]: raise
              print('Static files are ready. Select gh-pages / root in repository Settings > Pages to activate hosting.')
          PY
